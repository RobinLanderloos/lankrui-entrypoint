services:
  # Traefik
  traefik:
    image: traefik:v3.7.17
    container_name: traefik
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "127.0.0.1:8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./traefik/config/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/config/dynamic:/etc/traefik/dynamic:ro
      - ./traefik/certs:/certs
      - ./traefik/logs:/logs
    labels:
      - "traefik.enable=true"
    env_file:
      - path: "./traefik/.traefik-env"
        required: true
  # Authentik
  postgresql:
    image: docker.io/library/postgres:16.10-alpine
    restart: unless-stopped
    container_name: authentik-postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}" ]
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 5s
    volumes:
      - ./authentik/postgresql/data:/var/lib/postgresql/data
    env_file:
      - ./authentik/.authentik-env
  server:
    image: ${AUTHENTIK_IMAGE:-ghcr.io/goauthentik/server}:${AUTHENTIK_TAG:-2026.8.5}
    container_name: authentik-server
    restart: unless-stopped
    command: server
    volumes:
      - ./authentik/data:/data
      - ./authentik/custom-templates:/templates
    env_file:
      - ./authentik/.authentik-env
    depends_on:
      postgresql:
        condition: service_healthy
  worker:
    image: ${AUTHENTIK_IMAGE:-ghcr.io/goauthentik/server}:${AUTHENTIK_TAG:-2026.8.5}
    container_name: authentik-worker
    restart: unless-stopped
    command: worker
    # `user: root` and the docker socket volume are optional.
    # See more for the docker socket integration here:
    # https://goauthentik.io/docs/outposts/integrations/docker
    # Removing `user: root` also prevents the worker from fixing the permissions
    # on the mounted folders, so when removing this make sure the folders have the correct UID/GID
    # (1000:1000 by default)
    user: root
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./authentik/data:/data
      - ./authentik/certs:/certs
      - ./authentik/custom-templates:/templates
    env_file:
      - ./authentik/.authentik-env
    depends_on:
      postgresql:
        condition: service_healthy
